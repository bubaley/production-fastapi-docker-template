# Grouped minor/patch updates: uv and npm weekly, GitHub Actions and images monthly. Each ecosystem waits a few
# days after a release (cooldown) so broken releases are usually yanked before a PR opens.
# Commit prefixes feed the release rules in cliff.toml: chore(deps) and build(deps) release a patch,
# ci(deps) (GitHub Actions) does not.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      # TypeScript 7 (native compiler) is not supported by vue-tsc yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # 3.3.12-3.3.14 regress template type checking (vuejs/language-tools#6322, #6341); try the next release.
      - dependency-name: vue-tsc
        versions: [">= 3.3.12, < 3.3.15"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Dockerfile base images. A new Python minor (3.16) or Node major changes the runtime: bump those by hand
  # together with .python-version / .nvmrc. Keep the uv image in step with UV_VERSION (ci.yaml) and uv-pre-commit.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # PostgreSQL and Redis in compose files: a major version needs a data migration, so only minor/patch.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      include: scope
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
