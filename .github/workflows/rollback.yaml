# Redeploy an earlier release by its image digest. See docs/deployment.md#rollback.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to redeploy, e.g. v1.4.2 or 1.4.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Redeploy ${{ inputs.tag }}
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Yandex Cloud workload identity federation (vars.YC_SA_ID)
    environment: production
    # Shares the lock with the deploy job in ci.yaml.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # The registry the deploy job in ci.yaml pulls from: Yandex CR, or Docker Hub when that is the only one.
      YC_IMAGE: ${{ vars.YC_REGISTRY_ID != '' && vars.IMAGE_NAME != '' && format('cr.yandex/{0}/{1}', vars.YC_REGISTRY_ID, vars.IMAGE_NAME) || '' }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      # Same default as DOCKERHUB_REPOSITORY in ci.yaml; `make init` renames it.
      DOCKERHUB_REPOSITORY: fastapi-nuxt-template
    steps:
      - name: Check the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="${INPUT_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${INPUT_TAG}' is not a release tag like v1.4.2"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deploy with the compose.yaml of that release, so file and image match.
      - name: compose.yaml of the release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git fetch --quiet --depth=1 origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git show "v${VERSION}:compose.yaml" > "$RUNNER_TEMP/compose.yaml"
      - name: Log in to Yandex Container Registry
        if: env.YC_IMAGE != ''
        uses: yc-actions/yc-cr-login@ee42362bcacb854964afa3a3180ca8ae6dd388f8 # v3.0.2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_KEY_JSON }}
          yc-sa-id: ${{ vars.YC_SA_ID }}
      - name: Log in to Docker Hub
        if: env.YC_IMAGE == '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve the image digest
        id: digest
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          image="$YC_IMAGE"
          if [ -z "$image" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            image="${DOCKERHUB_IMAGE:-$DOCKERHUB_REPOSITORY}"
            case "$image" in */*) ;; *) image="${DOCKERHUB_USERNAME}/${image}" ;; esac
          fi
          if [ -z "$image" ]; then
            echo "::error::no registry configured (YC_REGISTRY_ID + IMAGE_NAME, or DOCKERHUB_USERNAME)"
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          digest=$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve ${image}:${VERSION}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Deploy by digest
        uses: ./.github/actions/deploy
        with:
          image: ${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}
          compose-file: ${{ runner.temp }}/compose.yaml
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          path: ${{ vars.DEPLOY_PATH }}
