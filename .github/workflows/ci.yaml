# One pipeline: changes -> backend / frontend / pre-commit / image -> gate,
# then on push to main: release -> publish (Yandex CR and/or Docker Hub) -> deploy. See docs/deployment.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: Release tag to build and push to the registries again, e.g. v1.4.2 (no checks, no release). Empty runs the whole pipeline
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be releasing or deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.13.9" # keep in sync with the uv image in Dockerfile and uv-pre-commit in .pre-commit-config.yaml
  GIT_CLIFF_VERSION: "2.14.2"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1 # keep in sync with the gitleaks rev in .pre-commit-config.yaml
  CI_IMAGE: fastapi-nuxt-template:ci
  # Docker Hub repository when vars.DOCKERHUB_IMAGE is empty; `make init` renames it.
  DOCKERHUB_REPOSITORY: fastapi-nuxt-template
  # One BuildKit cache for every image build; only runs on main write it, pull requests read it.
  BUILD_CACHE: type=gha,scope=app-image
  # No .dockerbuild record artifact per build (the job summary stays).
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  changes:
    name: Detect changes
    if: ${{ !inputs.republish }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.base.outputs.all }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pushes compare with the last release tag: history and tags must be local.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          fetch-tags: ${{ github.event_name == 'push' }}
      # Pull requests: what the PR touches (paths-filter asks the API). Pushes to main: everything since the last
      # release tag, so every released change was checked on main and a docs-only push skips the heavy jobs.
      # Manual runs and a repository without releases: everything.
      - name: Comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all=false
          sha=""
          if [ "$EVENT" = push ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
            if [ -n "$tag" ]; then
              sha=$(git rev-list -n 1 "$tag")
              echo "Changes since ${tag} (${sha::7})"
            else
              all=true
            fi
          elif [ "$EVENT" != pull_request ]; then
            all=true
          fi
          echo "all=${all}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - '.claude/hooks/**'
              - '.claude/settings.json'
              # Skills are checked by scripts/tests/test_agent_skills.py.
              - '.agents/**'
              - '.claude/skills/**'
              - '.python-version'
              - 'Makefile'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - 'Makefile'
              - '.github/workflows/ci.yaml'
            infra:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Caddyfile'
              - 'docker/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yaml'
            # Pull requests scan the image with Trivy only when these change.
            deps:
              - 'Dockerfile'
              - 'docker/**'
              - 'backend/uv.lock'
              - 'frontend/pnpm-lock.yaml'

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      # Same versions as compose.yaml (Dependabot does not update workflow service images).
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdefghijklmnop
      ENCRYPTION_KEY: ci-only-encryption-key-32-chars!
      SQL_HOST: localhost
      SQL_PORT: "5432"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_DATABASE: postgres
      REDIS_URL: redis://localhost:6379/0
      BROKER_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python comes from .python-version (uv downloads it if the runner lacks it).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Lint, format, types, tests (PostgreSQL)
        run: make check-backend PYTEST_ARGS=

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version from packageManager in frontend/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      # The production build (nuxt build) runs once, inside the image job.
      - name: Format, lint, types, tests, architecture
        run: make check-frontend

  pre-commit:
    name: Repository hygiene
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the commits of the push or pull request
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # `make check-hygiene` holds the pre-commit version and SKIP list, so `make check` runs the same hooks locally:
      # ruff and ty already run in the backend job; gitleaks (staged files only) runs as the next step instead.
      - name: pre-commit (yaml, eol, large files, pyupgrade, bandit, uv lock, pyproject)
        run: make check-hygiene
      # The CLI image needs no license (gitleaks-action does for organization repositories).
      - name: Secret scan of new commits (gitleaks)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push) if [[ "$BEFORE" =~ ^0+$ ]]; then range="-1"; else range="${BEFORE}..${GITHUB_SHA}"; fi ;;
            *) range="" ;; # manual run: full history
          esac
          echo "Scanning: ${range:-full history}"
          docker run --rm -v "${PWD}:/repo" --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner --verbose --log-opts="$1"' \
            _ "$range"

  image:
    name: Image build and smoke test
    needs: changes
    if: >-
      needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        run: |
          echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false # the runner is discarded anyway
      # Exporting the cache (mode=max) takes about a minute, so pull requests only read it.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: ${{ env.BUILD_CACHE }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('{0},mode=max,ignore-error=true', env.BUILD_CACHE) || '' }}
      - name: Smoke test (compose.yaml with PostgreSQL and Redis)
        env:
          APP_IMAGE: ${{ env.CI_IMAGE }}
          COMPOSE_PROJECT_NAME: smoke
          APP_ENTRY_PORT: 127.0.0.1:8080
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789abcdefghijklmnop
          ENCRYPTION_KEY=ci-only-encryption-key-32-chars!
          EOF
          docker compose -f compose.yaml up -d --wait --wait-timeout 240
          base=http://127.0.0.1:8080

          curl -fsS "$base/healthz"
          echo " <- /healthz"

          curl -fsSL "$base/" -o page.html
          grep -q 'id="__nuxt"' page.html
          grep -q 'property="og:title"' page.html
          echo "/ is server-rendered with its meta tags"

          asset=$(grep -o '/_nuxt/[^"]*\.js' page.html | head -n 1)
          curl -fsS -D headers.txt -o /dev/null "$base$asset"
          grep -qi '^cache-control: public, max-age=31536000, immutable' headers.txt
          echo "$asset is served with immutable caching"

          code=$(curl -s -o api.json -w '%{http_code}' "$base/api/v1/auth/me")
          test "$code" = 401
          jq -e . api.json > /dev/null
          echo "/api/v1/auth/me reaches FastAPI (401 JSON without credentials)"
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -p smoke logs --no-color --tail 300
      - name: Stop smoke stack
        if: always()
        run: docker compose -f compose.yaml -p smoke down -v
      # Every image on main; pull requests only when the base images or lockfiles change.
      - name: Vulnerability scan (fail on fixable CRITICAL)
        if: github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gate:
    name: CI gate
    if: ${{ always() && !inputs.republish }}
    needs: [changes, backend, frontend, pre-commit, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: backend, frontend, image

  release:
    name: Release
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    outputs:
      released: ${{ steps.push.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # A GitHub App token can push past branch protection (add the app to the bypass list);
      # without it the job falls back to GITHUB_TOKEN, which works only on an unprotected main.
      - name: Release token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Skip if main moved since the tested commit
        id: guard
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=Release skipped::main moved from ${GITHUB_SHA::7} to ${head::7}; the CI run for the newer commit releases it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.guard.outputs.proceed == 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - name: Next version from conventional commits
        id: version
        if: steps.guard.outputs.proceed == 'true'
        run: |
          current=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo none)
          next=$(uvx --from "git-cliff==${GIT_CLIFF_VERSION}" git-cliff --bumped-version)
          if [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "::notice title=No release::no feat/fix/perf/revert/build/deps or breaking commits since ${current}."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing ${next} (previous: ${current})"
          {
            echo "bump=true"
            echo "tag=${next}"
            echo "version=${next#v}"
          } >> "$GITHUB_OUTPUT"
      # Only version.json and CHANGELOG.md: neither is in the Docker build context, so the release commit keeps
      # every image layer cached. The image gets the version through APP_VERSION.
      - name: Update version.json and changelog
        if: steps.version.outputs.bump == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' version.json > "$RUNNER_TEMP/version.json"
          mv "$RUNNER_TEMP/version.json" version.json
          uvx --from "git-cliff==${GIT_CLIFF_VERSION}" git-cliff --tag "$TAG" --output CHANGELOG.md
          # git-cliff ends the file with a blank line; end-of-file-fixer expects exactly one newline.
          perl -0pi -e 's/\n+\z/\n/' CHANGELOG.md
          uvx --from "git-cliff==${GIT_CLIFF_VERSION}" git-cliff --tag "$TAG" --unreleased --strip all --output "$RUNNER_TEMP/release-notes.md"
          git diff --stat
      - name: Commit, tag and push
        id: push
        if: steps.version.outputs.bump == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "$TAG" -m "Release ${TAG}"
          if ! git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"; then
            git fetch --quiet origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::notice title=Release skipped::main moved while releasing; the CI run for the newer commit releases it."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Release push rejected::check that the release token may bypass branch protection (docs/deployment.md)."
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
      - name: GitHub Release
        if: steps.push.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

  # One build of the release tag, pushed to every configured registry: Yandex CR (vars.YC_REGISTRY_ID and
  # vars.IMAGE_NAME) and/or Docker Hub (vars.DOCKERHUB_USERNAME). Off until one of them is configured.
  # Yandex CR rejects attestation manifests, so it always gets a plain image; Docker Hub follows ATTESTATIONS.
  publish:
    name: Publish image
    needs: release
    if: >-
      !cancelled() &&
      (needs.release.outputs.released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.republish != '')) &&
      ((vars.YC_REGISTRY_ID != '' && vars.IMAGE_NAME != '') || vars.DOCKERHUB_USERNAME != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Yandex Cloud workload identity federation (vars.YC_SA_ID)
      packages: write # optional attestation copy in GHCR (vars.ATTESTATIONS == 'ghcr')
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      latest: ${{ steps.ref.outputs.latest }}
      image: ${{ steps.ref.outputs.deploy-image }}
      # Digest of the deploy image: Yandex CR when configured, else Docker Hub (the two differ with attestations).
      digest: ${{ steps.build-yc.outputs.digest || steps.build-hub.outputs.digest }}
    env:
      YC_IMAGE: ${{ vars.YC_REGISTRY_ID != '' && vars.IMAGE_NAME != '' && format('cr.yandex/{0}/{1}', vars.YC_REGISTRY_ID, vars.IMAGE_NAME) || '' }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      REQUESTED_TAG: ${{ inputs.republish }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      # Docker Hub only (Yandex CR always gets a plain image): registry: SBOM + provenance attached on Docker Hub;
      # ghcr: plain images, attested copy in GHCR; off: none.
      ATTESTATIONS: ${{ vars.ATTESTATIONS || 'registry' }}
    steps:
      - name: Release tag
        id: release
        run: |
          tag="${REQUESTED_TAG:-$RELEASE_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${tag}' is not a release tag like v1.4.2"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # Full history and tags: the newest tag decides whether `latest` moves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # Key file (secrets.YC_KEY_JSON) or keyless OIDC federation (vars.YC_SA_ID).
      - name: Log in to Yandex Container Registry
        if: env.YC_IMAGE != ''
        uses: yc-actions/yc-cr-login@ee42362bcacb854964afa3a3180ca8ae6dd388f8 # v3.0.2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_KEY_JSON }}
          yc-sa-id: ${{ vars.YC_SA_ID }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image references
        id: ref
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          # Republishing an older release must not move `latest` (or X.Y) back, nor redeploy it.
          if [ "$TAG" = "$newest" ]; then latest=true; else latest=false; fi

          images=()
          if [ -n "$YC_IMAGE" ]; then images+=("$YC_IMAGE"); fi
          dockerhub=""
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            dockerhub="${DOCKERHUB_IMAGE:-$DOCKERHUB_REPOSITORY}"
            # A bare repository name gets the Docker Hub namespace of the account.
            case "$dockerhub" in */*) ;; *) dockerhub="${DOCKERHUB_USERNAME}/${dockerhub}" ;; esac
            # A new release never overwrites a version Docker Hub already has; a manual republish does.
            if [ -z "$REQUESTED_TAG" ] && docker buildx imagetools inspect "${dockerhub}:${version}" > /dev/null 2>&1; then
              echo "::notice title=Docker Hub skipped::${dockerhub}:${version} is already published."
              dockerhub=""
            else
              images+=("$dockerhub")
            fi
          fi
          if [ "${#images[@]}" -eq 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "proceed=true"
            echo "version=${version}"
            echo "latest=${latest}"
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short=7 HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "yc=${YC_IMAGE}"
            echo "dockerhub=${dockerhub}"
            # The deploy job pulls by digest from Yandex CR, or from Docker Hub when that is the only registry.
            echo "deploy-image=${images[0]}"
            echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}"
            # Docker Hub only; Yandex CR answers "Cannot read manifest data" to attestation manifests.
            if [ "$ATTESTATIONS" = registry ]; then echo "attest=true"; else echo "attest=false"; fi
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.ref.outputs.proceed == 'true'
        with:
          cleanup: false
      - name: Tags and labels
        id: meta
        if: steps.ref.outputs.proceed == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.images }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.ref.outputs.latest == 'true' }}
            type=raw,value=sha-${{ steps.ref.outputs.short }}
            type=raw,value=latest,enable=${{ steps.ref.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
      - name: Tags per registry
        id: tags
        if: steps.ref.outputs.proceed == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          YC: ${{ steps.ref.outputs.yc }}
          DOCKERHUB: ${{ steps.ref.outputs.dockerhub }}
        run: |
          {
            echo "yc<<EOF"
            if [ -n "$YC" ]; then awk -v prefix="${YC}:" 'index($0, prefix) == 1' <<< "$TAGS"; fi
            echo "EOF"
            echo "dockerhub<<EOF"
            if [ -n "$DOCKERHUB" ]; then awk -v prefix="${DOCKERHUB}:" 'index($0, prefix) == 1' <<< "$TAGS"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The release commit only changes version.json and CHANGELOG.md, so this build reuses the layers the image
      # job cached on main; it does not write the cache again. The Docker Hub push below reuses this build.
      - name: Build and push to Yandex CR (no attestations)
        id: build-yc
        if: steps.ref.outputs.proceed == 'true' && steps.ref.outputs.yc != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.yc }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.version }}
            GIT_SHA=${{ steps.ref.outputs.sha }}
            BUILD_DATE=${{ steps.ref.outputs.created }}
          provenance: false
          sbom: false
          cache-from: ${{ env.BUILD_CACHE }}
      - name: Build and push to Docker Hub
        id: build-hub
        if: steps.ref.outputs.proceed == 'true' && steps.ref.outputs.dockerhub != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.dockerhub }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.version }}
            GIT_SHA=${{ steps.ref.outputs.sha }}
            BUILD_DATE=${{ steps.ref.outputs.created }}
          provenance: ${{ steps.ref.outputs.attest == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.ref.outputs.attest == 'true' }}
          cache-from: ${{ env.BUILD_CACHE }}
      - name: Log in to GHCR
        if: steps.ref.outputs.proceed == 'true' && env.ATTESTATIONS == 'ghcr'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push attested copy to GHCR
        if: steps.ref.outputs.proceed == 'true' && env.ATTESTATIONS == 'ghcr'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.ghcr }}:${{ steps.ref.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.version }}
            GIT_SHA=${{ steps.ref.outputs.sha }}
            BUILD_DATE=${{ steps.ref.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ env.BUILD_CACHE }}
      # Dokploy pulls `latest` (or a pinned version) from Docker Hub: redeploy only when `latest` moved.
      - name: Redeploy in Dokploy
        if: steps.ref.outputs.dockerhub != '' && steps.ref.outputs.latest == 'true'
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; redeploy in Dokploy by hand or with its autodeploy."
          else
            curl -fsS -X POST "$WEBHOOK" -o /dev/null
          fi
      - name: Summary
        if: steps.ref.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          YC_DIGEST: ${{ steps.build-yc.outputs.digest }}
          HUB_DIGEST: ${{ steps.build-hub.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image ${TAG}"
            echo
            if [ -n "$YC_DIGEST" ]; then echo "- Yandex CR: \`${YC_DIGEST}\`, no attestations"; fi
            if [ -n "$HUB_DIGEST" ]; then echo "- Docker Hub: \`${HUB_DIGEST}\`, attestations: ${ATTESTATIONS}"; fi
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: publish
    # Off until the server is configured (repository variable DEPLOY_ENABLED=true). Only the newest release;
    # use rollback.yaml to deploy an older one.
    if: >-
      !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.digest != '' &&
      needs.publish.outputs.latest == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          persist-credentials: false
      - name: Deploy by digest
        uses: ./.github/actions/deploy
        with:
          image: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          path: ${{ vars.DEPLOY_PATH }}
