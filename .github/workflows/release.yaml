name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# CHANGE IMAGE_NAME
# SET YC_REGISTRY, YC_KEY_JSON TO SECRETS IN REPO SETTINGS
env:
  REGISTRY: cr.yandex
  # IMAGE_NAME: image-name

jobs:
  prepare:
    name: Prepare version & changelog
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.clean_changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Prepare tested main branch
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo "::error::Main changed since this CI run; wait for CI on its current commit."
            exit 1
          fi
          git switch -C main "$TESTED_SHA"
      - name: Generate changelog & version
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.github_token }}
          git-user-name: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"
          version-file: "./version.json"
          version-path: "version"
          preset: "conventionalcommits"
          tag-prefix: "v"
          output-file: "false"
          skip-git-pull: "true"
          git-branch: "main"

  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.skipped == 'false' }}
    permissions:
      contents: read
    steps:
      # Template only: replace this step by uncommenting the build steps below.
      # Keep this job and the release dependency even while the build is disabled.
      - name: Production build disabled in template
        run: echo "Configure IMAGE_NAME, YC_REGISTRY and YC_KEY_JSON, then uncomment the build steps."
