# git-cliff: next version and CHANGELOG.md from conventional commits.
# Used by the `release` job in .github/workflows/ci.yaml; rules in docs/deployment.md#releases.
#
# Releasable: feat (minor), fix / perf / revert / build / chore(deps) (patch), any `!` or
# BREAKING CHANGE footer (major). Everything else is skipped and does not trigger a release.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
It is generated from conventional commits by the release job; do not edit it by hand.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Breaking commits are kept (and bump major) even when their type is otherwise skipped.
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Bug fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^revert", group = "<!-- 4 -->Reverts" },
    { message = "^(chore|build)\\(deps", group = "<!-- 5 -->Dependencies" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
