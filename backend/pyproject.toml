[project]
name = "fastapi-nuxt-template"
version = "0.8.0"
description = "Full-stack starter template with FastAPI and Nuxt"
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.117",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.161.0",
    "fastapi-ronin>=1.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "starlette>=1.9.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tortoise-orm[asyncpg]>=1.1.9",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]
optional-dependencies.otel = [
    "fastapi[opentelemetry]>=0.161.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
target-version = "py315"
line-length = 120
indent-width = 4
extend-exclude = [ "migrations" ]
force-exclude = true
format.quote-style = "single"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.extend-select = [ "I" ]
lint.ignore = [ "BLE001" ]
# conftest sets TESTING before importing the app.
lint.per-file-ignores."app/conftest.py" = [ "E402" ]
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.bandit]
exclude_dirs = [ "*/migrations/*", "*/tests/*", "tests" ]
# B105 flags any string constant named like `token` or `password` (cookie names, error messages, test fixtures).
skips = [ "B101", "B105" ]

[tool.pytest]
ini_options.testpaths = [ "app" ]
ini_options.pythonpath = [ "." ]
ini_options.python_files = [ "test_*.py" ]
ini_options.asyncio_mode = "auto"

[tool.pyupgrade]
py315-plus = true

[tool.tortoise]
tortoise_orm = "app.core.database.TORTOISE_ORM"
