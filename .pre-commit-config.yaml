exclude: backend/migrations/.*

# Hooks parse backend code, which uses Python 3.15 syntax.
default_language_version:
  python: python3.15

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # pnpm 12 writes pnpm-lock.yaml as several YAML documents.
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["--config", "backend/pyproject.toml"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
        files: backend/pyproject.toml
        args: ["--locked", "--project", "backend"]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt
        args: ["--keep-full-version", "--indent", "4"]

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --directory backend ty check
        language: system
        pass_filenames: false
